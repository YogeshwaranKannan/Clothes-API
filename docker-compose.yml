services:
  mongo:
    image: mongo:7
    container_name: api-mongo
    restart: unless-stopped
    # Single-node replica set (needed for transactions / replicaSet=rs0)
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "127.0.0.1:27018:27017"   # only reachable from this PC
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start; healthy once this node is PRIMARY
      test: [ 'CMD', 'mongosh', '--quiet', '--eval', 'try { if (rs.status().myState !== 1) quit(1) } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); quit(1) }' ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks:
      - app-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-springboot
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/Clothes?replicaSet=rs0
      SERVER_PORT: 8080
      APP_BASEURL: http://192.168.1.7:8082
      APP_EC2BASEURL: http://192.168.1.7:8082
      APP_SUGGESTURL: http://192.168.1.7:8082
      APP_IMAGE_STORAGE_PATH: http://192.168.1.7:8082/uploads
      APP_IMGURL: http://192.168.1.7:8082
    volumes:
      - api-uploads:/app/uploads
    networks:
      - app-net

volumes:
  mongo-data:
  api-uploads:

networks:
  app-net:

<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial; padding: 20px; }
        table { width: 100%%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<h2>Invoice Ref: {{refno}}</h2>
<p>Customer: {{buyerid}}</p>
<p>Date: {{date}}</p>
<table>
    <tr><th>No.</th><th>Product</th><th>Quantity</th><th>Rate</th><th>Total</th></tr>
    {{product_rows}}
</table>
<p><strong>Order Value:</strong> Rs.{{order_total}}</p>
<p><strong>CGST:</strong> Rs.{{cgst}}</p>
<p><strong>SGST:</strong> Rs.{{sgst}}</p>
<p><strong>Total GST:</strong> Rs.{{gst_total}}</p>
<p><strong>Payment Mode:</strong> {{payment}}</p>
<p><strong>Delivery Mode:</strong> {{delivery}}</p>
</body>
</html>
